<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" fill="none">
  <!-- Outer Sacred Vedic Astrology Wheel -->
  <circle cx="250" cy="250" r="230" stroke="#4F6359" stroke-width="1.2" opacity="0.18" stroke-dasharray="3 3"/>
  <circle cx="250" cy="250" r="215" stroke="#C1A273" stroke-width="0.8" opacity="0.22"/>
  <circle cx="250" cy="250" r="170" stroke="#4F6359" stroke-width="1" opacity="0.15"/>
  <circle cx="250" cy="250" r="120" stroke="#4F6359" stroke-width="0.8" opacity="0.12"/>
  <circle cx="250" cy="250" r="70" stroke="#C1A273" stroke-width="1.2" opacity="0.25"/>

  <!-- 12 Cardinal Astrological Divisions (12 Rashis / 12 Houses) -->
  <g stroke="#4F6359" stroke-width="0.8" opacity="0.15">
    <line x1="250" y1="35" x2="250" y2="465"/>
    <line x1="35" y1="250" x2="465" y2="250"/>
    <line x1="98" y1="98" x2="402" y2="402"/>
    <line x1="402" y1="98" x2="98" y2="402"/>
    <line x1="142" y1="64" x2="358" y2="436"/>
    <line x1="358" y1="64" x2="142" y2="436"/>
    <line x1="64" y1="142" x2="436" y2="358"/>
    <line x1="436" y1="142" x2="64" y2="358"/>
  </g>

  <!-- Traditional North Indian Diamond Kundali Chart at Center -->
  <g stroke="#C1A273" stroke-width="1" opacity="0.25">
    <rect x="179" y="179" width="142" height="142" transform="rotate(45 250 250)"/>
    <line x1="250" y1="150" x2="250" y2="350"/>
    <line x1="150" y1="250" x2="350" y2="250"/>
  </g>

  <!-- 12 Zodiac Rashi Glyphs around the rim -->
  <g fill="#4F6359" opacity="0.22" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <!-- Mesha (Aries) -->
    <text x="250" y="55">♈</text>
    <!-- Vrishabha (Taurus) -->
    <text x="345" y="80">♉</text>
    <!-- Mithuna (Gemini) -->
    <text x="420" y="155">♊</text>
    <!-- Karka (Cancer) -->
    <text x="445" y="250">♋</text>
    <!-- Simha (Leo) -->
    <text x="420" y="345">♌</text>
    <!-- Kanya (Virgo) -->
    <text x="345" y="420">♍</text>
    <!-- Tula (Libra) -->
    <text x="250" y="445">♎</text>
    <!-- Vrishchika (Scorpio) -->
    <text x="155" y="420">♏</text>
    <!-- Dhanu (Sagittarius) -->
    <text x="80" y="345">♐</text>
    <!-- Makara (Capricorn) -->
    <text x="55" y="250">♑</text>
    <!-- Kumbha (Aquarius) -->
    <text x="80" y="155">♒</text>
    <!-- Meena (Pisces) -->
    <text x="155" y="80">♓</text>
  </g>

  <!-- Planetary Sacred Dots (Navagrahas) -->
  <g fill="#C1A273" opacity="0.28">
    <circle cx="250" cy="250" r="4"/>
    <circle cx="250" cy="180" r="2.5"/>
    <circle cx="320" cy="250" r="2.5"/>
    <circle cx="250" cy="320" r="2.5"/>
    <circle cx="180" cy="250" r="2.5"/>
  </g>
</svg>
