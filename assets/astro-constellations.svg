<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <!-- Subtle Vedic Astrology & Zodiac Constellation Background Pattern -->
  <g stroke="#4F6359" stroke-width="0.8" opacity="0.12">
    <!-- Constellation lines -->
    <path d="M50 80 L110 50 L160 85 L200 60 L240 110" stroke-dasharray="2 3"/>
    <path d="M420 70 L470 120 L530 90 L560 140" stroke-dasharray="2 3"/>
    <path d="M80 380 L130 420 L180 390 L210 450" stroke-dasharray="2 3"/>
    <path d="M380 440 L430 400 L490 430 L550 370" stroke-dasharray="2 3"/>
    
    <!-- Sacred Diamond Kundali Grid Segment -->
    <path d="M300 220 L380 300 L300 380 L220 300 Z" stroke-width="1"/>
    <line x1="300" y1="220" x2="300" y2="380" stroke-dasharray="3 3"/>
    <line x1="220" y1="300" x2="380" y2="300" stroke-dasharray="3 3"/>
    <line x1="220" y1="220" x2="380" y2="380" stroke-width="0.6"/>
    <line x1="380" y1="220" x2="220" y2="380" stroke-width="0.6"/>

    <!-- Zodiac Rings & Orbit Lines -->
    <circle cx="300" cy="300" r="140" stroke-dasharray="4 6"/>
    <circle cx="300" cy="300" r="220" stroke-dasharray="2 6" stroke-width="0.5"/>
  </g>

  <!-- Astrological Planets & Star Nodes -->
  <g fill="#4F6359" opacity="0.16">
    <!-- Star Points -->
    <circle cx="50" cy="80" r="2"/>
    <circle cx="110" cy="50" r="2.5"/>
    <circle cx="160" cy="85" r="1.5"/>
    <circle cx="200" cy="60" r="2"/>
    <circle cx="240" cy="110" r="3"/>

    <circle cx="420" cy="70" r="2"/>
    <circle cx="470" cy="120" r="2.5"/>
    <circle cx="530" cy="90" r="1.8"/>
    <circle cx="560" cy="140" r="2.2"/>

    <circle cx="80" cy="380" r="2"/>
    <circle cx="130" cy="420" r="2.5"/>
    <circle cx="180" cy="390" r="1.8"/>
    <circle cx="210" cy="450" r="2.8"/>

    <circle cx="380" cy="440" r="2"/>
    <circle cx="430" cy="400" r="2.4"/>
    <circle cx="490" cy="430" r="1.8"/>
    <circle cx="550" cy="370" r="3"/>
  </g>

  <!-- Vedic Gold Highlights (Sun, Jupiter, Lucky Stars) -->
  <g fill="#C1A273" opacity="0.22">
    <!-- Twinkle Stars -->
    <path d="M120 200 L123 207 L130 210 L123 213 L120 220 L117 213 L110 210 L117 207 Z"/>
    <path d="M480 240 L482 245 L487 247 L482 249 L480 254 L478 249 L473 247 L478 245 Z"/>
    <path d="M260 90 L262 94 L266 96 L262 98 L260 102 L258 98 L254 96 L258 94 Z"/>
    <path d="M340 500 L342 505 L347 507 L342 509 L340 514 L338 509 L333 507 L338 505 Z"/>

    <!-- Small Celestial Symbols: Sun (Surya) & Moon (Chandra) -->
    <circle cx="300" cy="160" r="3"/>
    <circle cx="160" cy="300" r="3"/>
    <circle cx="440" cy="300" r="3"/>
    <circle cx="300" cy="440" r="3"/>
  </g>
</svg>
